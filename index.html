<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f7fbfa" />
  <meta name="description" content="ワンちゃんが会話をサポートする、やさしい1on1アプリ「わんおーわん」" />
  <title>わんおーわん｜話そう。聞こう。わんこと一緒に。</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-bg" aria-hidden="true">
    <span class="blob blob-a"></span><span class="blob blob-b"></span><span class="paw paw-a">🐾</span><span class="paw paw-b">🐾</span>
  </div>
  <div id="app">
    <header class="site-header">
      <button class="brand" id="homeButton" type="button" aria-label="トップへ戻る">
        <span class="brand-mark" aria-hidden="true">🐾</span>
        <span>わんおーわん</span>
      </button>
      <nav class="top-nav" aria-label="メインメニュー">
        <button class="nav-link" id="historyButton" type="button">
          <span aria-hidden="true">◷</span><span class="nav-label">これまでの記録</span>
        </button>
      </nav>
    </header>

    <main id="main" tabindex="-1"></main>

    <footer class="site-footer">
      <span>🐾</span> 会話の内容は、このブラウザーの中だけに保存されます
    </footer>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="modalRoot"></div>
  <script src="app.js"></script>
</body>
</html>
